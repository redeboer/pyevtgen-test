# cspell:ignore CIBW CLICOLOR conftest
name: Wheels

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CIBW_ENVIRONMENT_PASS_LINUX: CLICOLOR_FORCE CMAKE_COLOR_DIAGNOSTICS FORCE_COLOR
  CLICOLOR_FORCE: "1"
  CMAKE_COLOR_DIAGNOSTICS: "ON"
  FORCE_COLOR: "1"

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/update_index.py
      - .github/workflows/wheels.yml
      - CMakeLists.txt
      - conftest.py
      - docs/**
      - pyproject.toml
      - src/**
      - tests/**
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/update_index.py
      - .github/workflows/wheels.yml
      - CMakeLists.txt
      - conftest.py
      - docs/**
      - pyproject.toml
      - src/**
      - tests/**
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: Build ${{ matrix.python }} ${{ matrix.platform || 'native' }} wheel (${{ matrix.runs-on }})
    env:
      CIBW_BUILD: ${{ matrix.python }}-*
      CIBW_PLATFORM: ${{ matrix.platform || 'auto' }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - macos-15
          - macos-15-intel
          - ubuntu-24.04
          - ubuntu-24.04-arm
        # cp312 is the stable ABI wheel for Python 3.12 and newer
        python:
          - cp311
          - cp312
        # Pyodide has no stable ABI, so each Pyodide release needs its own wheel
        include:
          - { runs-on: ubuntu-24.04, python: cp313, platform: pyodide }
          - { runs-on: ubuntu-24.04, python: cp314, platform: pyodide }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheels-${{ matrix.runs-on }}-${{ matrix.python }}-${{ matrix.platform || 'native' }}
          path: wheelhouse/*.whl

  dist:
    name: Combine distributions
    needs:
      - sdist
      - wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
          pattern: dist-*
      - run: ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-distributions
          path: dist/*

  test:
    name: Test wheel (${{ matrix.runs-on }}, Python ${{ matrix.python-version }})
    needs: dist
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - macos-15
          - macos-15-intel
          - ubuntu-24.04
          - ubuntu-24.04-arm
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: all-distributions
          path: dist
      - run: uv venv
      - run: uv pip install --find-links dist --only-binary pyevtgen pyevtgen "pytest>=9"
      - run: .venv/bin/pytest tests

  docs:
    name: Build documentation
    needs: dist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: all-distributions
          path: dist
      - run: uv venv
      - run: uv pip install --find-links dist --only-binary pyevtgen pyevtgen --group doc
      - run: .venv/bin/sphinx-build --fail-on-warning --keep-going docs docs/_build/html
      - run: >-
          uv run --no-project .github/scripts/update_index.py dist docs/_build/html
          https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  pages:
    name: Publish documentation and package index to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs:
      - docs
      - test
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    environment:
      name: PyPI
      url: https://pypi.org/p/pyevtgen
    needs:
      - dist
      - test
    permissions:
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
          pattern: dist-*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
