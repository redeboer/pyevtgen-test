[dependencies]
cmake = ">=3.24"
cxx-compiler = "*"
ninja = "*"
prek = "*"
uv = "*"

[feature.dev.dependencies]
clang-tools = "*"

[environments]
default = []
dev = ["dev"]

[tasks.build]
cmd = "uv build"
description = "Build the source distribution and a wheel into dist/"

[tasks.doc]
cmd = "uv run --group doc --no-dev sphinx-build --fail-on-warning --keep-going docs docs/_build/html && uv run --group doc --no-dev marimo export html-wasm docs/marimo/explorer.py --output docs/_build/html/explorer --mode run --no-show-code && rm docs/_build/html/explorer/CLAUDE.md"
description = "Build the documentation, execute its notebooks, and export the marimo app"

[tasks.doclive]
cmd = "uv run --group doc --no-dev sphinx-autobuild --watch src docs docs/_build/html --re-ignore '/_build/|\\.ipynb_checkpoints/'"
description = "Build the documentation and update it on changes"

[tasks.style]
cmd = "uv run --group style --no-dev prek run --all-files"
description = "Perform all linting, formatting, and spelling checks"

[tasks.test]
cmd = "uv run --group test --no-dev pytest"
description = "Run all unit tests and doctests"

[tasks.upgrade]
depends-on = [
    "_upgrade-pixi",
    "_upgrade-precommit",
    "_upgrade-uv",
]
description = "Upgrade all lock files"

[tasks._upgrade-pixi]
cmd = "pixi update"

[tasks._upgrade-precommit]
cmd = "prek autoupdate"

[tasks._upgrade-uv]
cmd = "uv lock --upgrade"

[workspace]
channels = ["conda-forge"]
name = "pyevtgen"
platforms = [
    "linux-64",
    "linux-aarch64",
    "osx-64",
    "osx-arm64",
]
